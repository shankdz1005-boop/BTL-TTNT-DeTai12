name: Chay thuc nghiem
on: [push, workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python run_experiments.py
      - uses: actions/upload-artifact@v4
        with:
          name: ket-qua
          path: ket_qua.csv
